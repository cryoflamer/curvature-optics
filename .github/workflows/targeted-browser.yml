name: Curvature targeted Chromium

on:
  push:
    branches: [main]
    paths:
      - 'tests/browser/test_modern_smoke.py'
  workflow_dispatch:
    inputs:
      test_name:
        description: 'Exact Chromium smoke test method (test_...)'
        type: string
        required: true
        default: test_calibration_project_indexeddb_abort_retains_unsaved_retry

permissions:
  contents: read

jobs:
  targeted-browser:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    name: Targeted Chromium smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEST_NAME: ${{ inputs.test_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Playwright for test discovery
        run: python -m pip install playwright==1.57.0
      - name: Validate exactly one selected browser case
        run: |
          python - <<'PY'
          import os
          import re
          import subprocess
          import sys

          name = os.environ['TEST_NAME']
          if not re.fullmatch(r'test_[A-Za-z0-9_]{1,180}', name):
              sys.exit('Expected a single test_... method name (letters, digits, underscores)')
          result = subprocess.run(
              [sys.executable, 'tools/run-browser-smoke.py', '--match', name, '--list'],
              text=True, capture_output=True, check=True,
          )
          cases = [line for line in result.stdout.splitlines()
                   if line.startswith('test_modern_smoke.ModernBrowserSmoke.')]
          if len(cases) != 1 or cases[0] != 'test_modern_smoke.ModernBrowserSmoke.' + name:
              sys.exit(f'Expected exactly one exact test, got {cases!r}')
          print('Selected:', cases[0])
          PY
      - name: Cache Playwright Chromium downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.57.0-ubuntu-24.04
      - name: Install Chromium and browser dependencies
        run: python -m playwright install --with-deps chromium
      - name: Run only the selected Chromium test
        run: python tools/run-browser-smoke.py --match "$TEST_NAME"
      - name: Upload browser diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: targeted-chromium-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  new-browser-tests:
    if: ${{ github.event_name == 'push' }}
    name: Changed Chromium smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Discover added or modified test methods
        id: discover
        run: |
          python - <<'PY'
          import ast
          import os
          import re
          import subprocess
          from pathlib import Path

          path='tests/browser/test_modern_smoke.py'
          diff=subprocess.check_output(
              ['git','diff','--unified=0','HEAD^','HEAD','--',path],text=True)
          touched=set()
          for start,count in re.findall(
                  r'^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@',
                  diff,re.MULTILINE):
              first=int(start)
              touched.update(range(first,first+max(1,int(count or 1))))
          tree=ast.parse(Path(path).read_text(encoding='utf-8'))
          names=sorted({
              method.name
              for cls in tree.body
              if isinstance(cls,ast.ClassDef) and cls.name=='ModernBrowserSmoke'
              for method in cls.body
              if isinstance(method,ast.FunctionDef) and method.name.startswith('test_')
              and any(method.lineno<=line<=method.end_lineno for line in touched)
          })
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as output:
              output.write('names='+' '.join(names)+'\n')
          print('Added or modified browser tests:',names)
          PY
      - uses: actions/setup-python@v6
        if: ${{ steps.discover.outputs.names != '' }}
        with:
          python-version: '3.13'
      - name: Cache Playwright Chromium downloads
        if: ${{ steps.discover.outputs.names != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.57.0-ubuntu-24.04
      - name: Install Playwright and Chromium
        if: ${{ steps.discover.outputs.names != '' }}
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Run changed Chromium tests
        if: ${{ steps.discover.outputs.names != '' }}
        env:
          TEST_NAMES: ${{ steps.discover.outputs.names }}
        run: |
          for name in $TEST_NAMES; do
            python tools/run-browser-smoke.py --match "$name"
          done
      - name: Upload browser diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: auto-chromium-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
