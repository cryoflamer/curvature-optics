name: Curvature fast verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: 'Run fast checks or the full acceptance suite'
        type: choice
        required: true
        default: full
        options: [fast, full]

permissions:
  contents: read

# New pushes replace only obsolete fast runs; manual full runs are not cancelled.
concurrency:
  group: curvature-entry-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  fast-node:
    if: ${{ github.event_name == 'push' || inputs.scope == 'fast' }}
    name: Fast Node contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify persistence, calibration, History and Modern contracts
        run: |
          node --test --test-concurrency=2 \
            tests/ModernCalibrationProjects.test.js \
            tests/ModernCalibrationProjectCheckpoint.test.js \
            tests/ModernCalibrationResult.test.js \
            tests/ModernPhotoCalibrationEditor.test.js \
            tests/ModernReferenceImage.test.js \
            tests/ModernReferenceImageLibrary.test.js \
            tests/ModernExperimentHistory.test.js \
            tests/ModernHistoryPortability.test.js \
            tests/ModernSessionAutosave.test.js \
            tests/ModernAnimationProjectPersistence.test.js \
            tests/ModernAnimationDraftAutosave.test.js \
            tests/ModernAnimationWorkspacePersistence.test.js \
            tests/ModernAnimationWorkspaceRecovery.test.js \
            tests/ModernUiBootstrap.test.js \
            tests/ModernPrimaryEntry.test.js \
            tests/HistoricalDocumentationCleanup141276.test.js \
            tests/DocumentationConsolidation141275.test.js

  fast-architecture:
    if: ${{ github.event_name == 'push' || inputs.scope == 'fast' }}
    name: Architecture and protected Legacy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify boundaries, Legacy, protected PNG and representative regressions
        run: node tools/check-refactor-closure.js

  full:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.scope != 'fast' }}
    name: Full acceptance
    uses: ./.github/workflows/full-verification.yml
