name: Curvature verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: curvature-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-regression:
    name: Node regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run complete Node regression suite
        run: node --test --test-concurrency=2 tests/*.test.js

  refactor-closure:
    name: Architecture and Legacy preservation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify refactor closure
        run: node tools/check-refactor-closure.js
      - name: Validate protected Legacy browser references
        run: python tools/validate-legacy-visual-reference.py

  browser-smoke:
    name: Chromium UI smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Playwright
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test real DOM, storage and keyboard interaction
        run: python -m unittest discover -s tests/browser -p 'test_*.py' -v
      - name: Upload browser diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: chromium-smoke-failure-${{ github.run_attempt }}
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
